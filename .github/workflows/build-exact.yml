name: RuVideoHub 3.6.21 - Exact APK Patch

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/RuVideoHub_3.6.21.apk'
      - 'patch/**'
      - 'scripts/**'
      - '.github/workflows/build-exact.yml'

permissions:
  contents: read

concurrency:
  group: ruvideohub-exact-3-6-21-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Preserve APK UI/Player + Smart Search + No Updates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify input APK
        shell: bash
        run: |
          set -euo pipefail
          test -f input/RuVideoHub_3.6.21.apk
          echo "Input APK size:" 
          stat -c '%s bytes' input/RuVideoHub_3.6.21.apk
          unzip -p input/RuVideoHub_3.6.21.apk META-INF/com/android/build/gradle/app-metadata.properties || true
          unzip -p input/RuVideoHub_3.6.21.apk META-INF/version-control-info.textproto || true

      - name: Download Apktool 3.0.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fsSL \
            -o tools/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar tools/apktool.jar --version

      - name: Decode APK without decoding resources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/decoded
          mkdir -p build
          java -jar tools/apktool.jar d \
            --force \
            --no-res \
            input/RuVideoHub_3.6.21.apk \
            -o build/decoded

      - name: Apply Smart Search and disable update UI/checker
        shell: bash
        run: |
          set -euo pipefail
          python3 patch/patch_apk.py build/decoded

      - name: Rebuild patched APK
        shell: bash
        run: |
          set -euo pipefail
          java -jar tools/apktool.jar b \
            build/decoded \
            -o build/rebuilt-unsigned.apk
          test -s build/rebuilt-unsigned.apk

      - name: Compile injected SmartSearch helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/helper-classes build/helper-dex
          javac -source 11 -target 11 \
            -d build/helper-classes \
            patch/SmartSearchBridge.java

          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -x "${BUILD_TOOLS}/d8"

          ANDROID_JAR="$(find "${ANDROID_HOME}/platforms" -name android.jar | sort -V | tail -n1)"
          test -f "${ANDROID_JAR}"

          d8 \
            --min-api 24 \
            --lib "${ANDROID_JAR}" \
            --output build/helper-dex \
            build/helper-classes/com/example/utils/SmartSearchBridge.class

          test -s build/helper-dex/classes.dex

      - name: Inject helper dex
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/add_dex.py \
            build/rebuilt-unsigned.apk \
            build/helper-dex/classes.dex \
            build/rebuilt-with-helper.apk

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "${BUILD_TOOLS}/zipalign" -f -p 4 \
            build/rebuilt-with-helper.apk \
            build/aligned.apk
          "${BUILD_TOOLS}/zipalign" -c -P 16 -v 4 build/aligned.apk

      - name: Create signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/signing
          keytool -genkeypair \
            -keystore build/signing/patch-debug.jks \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks build/signing/patch-debug.jks \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/RuVideoHub-3.6.21-smart-search-no-update.apk \
            build/aligned.apk

          "${BUILD_TOOLS}/apksigner" verify --verbose \
            build/RuVideoHub-3.6.21-smart-search-no-update.apk

      - name: Final APK report
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          echo "=== FINAL APK ==="
          stat -c '%n - %s bytes' build/RuVideoHub-3.6.21-smart-search-no-update.apk
          "${BUILD_TOOLS}/aapt2" dump packagename build/RuVideoHub-3.6.21-smart-search-no-update.apk
          unzip -l build/RuVideoHub-3.6.21-smart-search-no-update.apk | grep -E 'classes[0-9]*\.dex$' || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuVideoHub-3.6.21-smart-search-no-update
          path: build/RuVideoHub-3.6.21-smart-search-no-update.apk
          if-no-files-found: error
          retention-days: 30
