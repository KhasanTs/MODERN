name: Build RuVideoHub 3.6.21 - Smart Search No Update

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify input APK
        shell: bash
        run: |
          set -euo pipefail
          test -f input/RuVideoHub_3.6.21.apk
          stat -c '%s bytes' input/RuVideoHub_3.6.21.apk

      - name: Install Apktool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fL --retry 3 \
            -o "$HOME/bin/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar

          cat > "$HOME/bin/apktool" <<'EOF'
          #!/usr/bin/env bash
          exec java -jar "$HOME/bin/apktool.jar" "$@"
          EOF
          chmod +x "$HOME/bin/apktool"
          echo "$HOME/bin" >> "$GITHUB_PATH"
export PATH="$HOME/bin:$PATH"
          "$HOME/bin/apktool" --version

      - name: Decode exact official APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          "$HOME/bin/apktool" d input/RuVideoHub_3.6.21.apk \
            -o work

          test -f work/AndroidManifest.xml
          find work -type f -name 'VideoViewModel$filteredVideos$1.smali' -print
          find work -type f -name 'HomeHeaderKt.smali' -print
          find work -type f -name 'LibraryTabScreenKt.smali' -print
          find work -type f -name 'UpdateSectionKt.smali' -print

      - name: Apply exact smart-search and no-update patch
        shell: bash
        run: |
          set -euo pipefail
          python3 patch/patch_smali.py work

      - name: Compile SmartSearch helper to DEX
        shell: bash
        run: |
          set -euo pipefail
          rm -rf helper
          mkdir -p helper/classes helper/dex

          javac -source 8 -target 8 \
            -d helper/classes \
            patch/SmartSearch.java

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "Using build-tools: $BUILD_TOOLS"

          "$BUILD_TOOLS/d8" \
            --min-api 24 \
            --lib "$ANDROID_HOME/platforms/android-36/android.jar" \
            --output helper/dex \
            helper/classes/com/example/utils/SmartSearch.class

          test -f helper/dex/classes.dex
          cp helper/dex/classes.dex work/smartsearch.dex

      - name: Rebuild patched APK
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/bin/apktool" b work -o unsigned.apk
          test -f unsigned.apk

      - name: Inject SmartSearch classes3.dex
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("unsigned.apk", "r") as zin, \
               zipfile.ZipFile("patched-raw.apk", "w") as zout:
              for item in zin.infolist():
                  zout.writestr(item, zin.read(item.filename))
              info = zipfile.ZipInfo("classes3.dex")
              info.compress_type = zipfile.ZIP_STORED
              info.external_attr = 0o644 << 16
              with open("work/smartsearch.dex", "rb") as f:
                  zout.writestr(info, f.read())
          PY

      - name: Create signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore signing.jks \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

      - name: Zipalign
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 patched-raw.apk aligned.apk

      - name: Sign and verify
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out RuVideoHub-3.6.21-smart-search-no-update.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose \
            RuVideoHub-3.6.21-smart-search-no-update.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RuVideoHub-3.6.21-smart-search-no-update
          path: RuVideoHub-3.6.21-smart-search-no-update.apk
          if-no-files-found: error
          retention-days: 14
